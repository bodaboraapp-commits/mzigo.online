# Mzigo.online — Apache 2.4 vhost for a production-style deployment.
# Serves the project root directly; PHP module mode (mod_php) is required.
#
#   a2enmod rewrite headers php8.2
#   a2ensite mzigo && systemctl reload apache2
#
# For PHP-FPM instead, remove the SetHandler block and use:
#   <FilesMatch "\.php$">
#       SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
#   </FilesMatch>

<VirtualHost *:80>
    ServerName app.example.co.ke
    DocumentRoot /var/www/mzigo

    # Force HTTPS in production (uncomment once TLS is configured).
    # <IfModule mod_rewrite.c>
    #     RewriteEngine On
    #     RewriteCond %{HTTPS} !=on
    #     RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
    # </IfModule>

    <Directory /var/www/mzigo>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler application/x-httpd-php
    </FilesMatch>

    # Never serve source/config/build folders.
    <DirectoryMatch "^/var/www/mzigo/(_raw|_server)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^_">
        Require all denied
    </FilesMatch>

    # Security headers (align with deploy/nginx.conf).
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
        Header always set Cross-Origin-Opener-Policy "same-origin"
        # Enable only after HTTPS is verified working:
        # Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/mzigo-error.log
    CustomLog ${APACHE_LOG_DIR}/mzigo-access.log combined
</VirtualHost>
