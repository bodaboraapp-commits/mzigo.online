# Mzigo.online — nginx + PHP-FPM deployment example.
# The static site has clean URLs (/send-mzigo, /partners, /billing …) and API
# endpoints under /api. Source/build folders are never served.

server {
    listen 80;
    server_name app.example.co.ke;
    root /var/www/mzigo;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Block source/config/build folders and PHP include files
    location ~ ^/(_raw|_server)/ { deny all; }
    location ~ /\. { deny all; }
    location ~ ^/api/_ { deny all; }

    # PHP API
    location ~ ^/api/.+\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # Carrier-specific wizard -> shared page (mirrors .htaccess)
    location ~ ^/send-mzigo/[A-Za-z0-9_-]+/?$ {
        try_files /send-mzigo.html =404;
    }

    # Clean URLs: /partners -> partners.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    access_log /var/log/nginx/mzigo-access.log;
    error_log  /var/log/nginx/mzigo-error.log;
}
