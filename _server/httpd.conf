# Dedicated Apache instance for the Mzigo.online clone preview.
# Serves C:/xampp/htdocs/www/mzigo on http://localhost:8090 with clean URLs.
# Base install: XAMPP Apache 2.4.58 (C:/xampp/apache). Does not touch the
# shared XAMPP config, which is left on port 80 for other projects.

ServerRoot "C:/xampp/apache"

Listen 127.0.0.1:8090
ServerName localhost:8090

PidFile "C:/xampp/htdocs/www/mzigo/_server/apache.pid"
ErrorLog "C:/xampp/htdocs/www/mzigo/_server/logs/error.log"
LogLevel warn

LoadModule access_compat_module modules/mod_access_compat.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule alias_module modules/mod_alias.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule expires_module modules/mod_expires.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so

# PHP (module mode) — enables the Mzigo.online API endpoints.
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"
PHPIniDir "C:/xampp/php"
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

<IfModule mime_module>
    TypesConfig conf/mime.types
    AddType application/font-woff2 .woff2
    AddType image/svg+xml .svg
    AddType application/manifest+json .webmanifest
</IfModule>

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    CustomLog "C:/xampp/htdocs/www/mzigo/_server/logs/access.log" combined
</IfModule>

<IfModule deflate_module>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json image/svg+xml
</IfModule>

<IfModule expires_module>
    ExpiresActive On
    ExpiresByType text/css "access plus 0 seconds"
    ExpiresByType application/javascript "access plus 0 seconds"
    ExpiresByType image/jpeg "access plus 7 days"
    ExpiresByType image/png "access plus 7 days"
    ExpiresByType font/woff2 "access plus 30 days"
</IfModule>

<Directory />
    AllowOverride none
    Require all denied
</Directory>

DocumentRoot "C:/xampp/htdocs/www/mzigo"

<Directory "C:/xampp/htdocs/www/mzigo">
    Options FollowSymLinks IncludesNOEXEC
    AllowOverride All
    Require all granted
</Directory>

<IfModule dir_module>
    DirectoryIndex index.html
</IfModule>

<FilesMatch "^\.ht">
    Require all denied
</FilesMatch>

# Never expose build/capture scaffolding over HTTP.
<DirectoryMatch "^C:/xampp/htdocs/www/mzigo/(_raw|_server)">
    Require all denied
</DirectoryMatch>

<IfModule headers_module>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    # Enable only after TLS is verified working:
    # Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</IfModule>

